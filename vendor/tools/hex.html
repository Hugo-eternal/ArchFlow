<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex/Bin Editor & Compare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B5C8A' stroke-width='2' stroke-linecap='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='2'/%3E%3Cpath d='M7 9h2M11 9h2M15 9h2M7 13h2M11 13h2M7 17h6'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
/* tool icon and close button, the same as RSI BOM Converter */
.tool-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:#EFEBF8;color:#5E4A9C;flex:none;align-self:center}
.tool-icon svg{width:16px;height:16px}
.ib.close{width:32px;height:32px;display:inline-grid;place-items:center;border:0;border-radius:6px;background:transparent;cursor:pointer;color:#5B6B7C;flex:none;margin-left:2px}
.ib.close:hover{background:#EEF2F6;color:#14202C}
.ib.close svg{width:18px;height:18px}

html,body{height:100%}
body{margin:0;font:14px/1.45 "Noto Sans TC","Microsoft JhengHei","PingFang TC","Segoe UI",system-ui,sans-serif;color:#14202C;background:#F3F5F8;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace}
button,input,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #DCE3EA;border-radius:8px;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#B9C6D3;background:#FAFBFC}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:#2B5C8A;border-color:#2B5C8A;color:#fff;font-weight:600}
.btn.pri:hover:not(:disabled){background:#244E76}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.view:focus-visible,.menu button:focus-visible,.dl button:focus-visible{outline:2px solid #2B5C8A;outline-offset:1px}
input.txt,select{height:30px;border:1px solid #CBD5DF;border-radius:7px;padding:0 9px;background:#fff}
input.txt.bad{border-color:#C2412D;background:#FFF6F4}
/* header */
header.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff;border-bottom:1px solid #E1E7EE}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.brand strong{font-size:18px;letter-spacing:-.2px}
.brand .tag{font-size:11px;color:#5B6B7C;border:1px solid #DCE3EA;border-radius:5px;padding:0 6px}
.grow{flex:1}
.tabs{display:flex;gap:2px;background:#EEF2F6;border-radius:9px;padding:3px}
.tab{border:0;background:none;height:28px;padding:0 14px;border-radius:7px;cursor:pointer;color:#4A5B6C}
.tab[aria-selected=true]{background:#fff;color:#14202C;font-weight:600;box-shadow:0 1px 2px rgba(15,24,33,.12)}
.lang{display:flex;border:1px solid #DCE3EA;border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;height:30px;padding:0 10px;cursor:pointer;font-size:13px;color:#5B6B7C}
.lang button[aria-pressed=true]{background:#EEF2F6;color:#14202C;font-weight:600}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:250px;background:#fff;border:1px solid #DCE3EA;border-radius:10px;box-shadow:0 14px 34px -14px rgba(15,24,33,.35);padding:5px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:7px 10px;cursor:pointer}
.menu button:hover:not(:disabled){background:#F1F4F8}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu b{display:block;font-weight:600;font-size:13.5px}.menu small{color:#5B6B7C;font-size:12px}
/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr}
aside.side{background:#fff;border-right:1px solid #E1E7EE;overflow:auto;padding:16px 16px 24px}
.side h3{font-size:12.5px;color:#5B6B7C;font-weight:600;margin:16px 0 6px}
.side h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:#5B6B7C}.kv dd{margin:0;text-align:right;word-break:break-all}
.fname{font-weight:600;font-size:14.5px;word-break:break-all;margin-bottom:2px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:9px;background:#EEF2F6;color:#3E4F60;margin-right:4px}
.pill.ok{background:#E6F4EC;color:#1D6B43}.pill.bad{background:#FDECEA;color:#A3321F}.pill.warn{background:#FFF4DC;color:#7A5400}
.list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;margin:0 -6px}
.list button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.list button:hover{background:#F1F4F8}
.list button.on{background:#E7EFF7}
.list button span:last-child{color:#5B6B7C}
.errs{font-size:12.5px;color:#A3321F;margin:0;padding-left:16px;max-height:140px;overflow:auto}
.note{font-size:12px;color:#5B6B7C;margin:6px 0 0}
section.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #E1E7EE}
.bar .sep{width:1px;height:22px;background:#E1E7EE;margin:0 2px}
.bar label{font-size:13px;color:#4A5B6C;display:flex;align-items:center;gap:6px}
.status{font-size:12.5px;color:#5B6B7C;margin-left:auto}
.status.bad{color:#A3321F}
/* hex view */
.view{flex:1;min-height:0;overflow:auto;position:relative;background:#fff;font:13px/22px ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;outline:none}
.spacer{position:relative}
.row{position:absolute;left:0;right:0;height:22px;display:flex;white-space:pre;padding-left:16px}
.row:nth-child(even){background:#FAFBFC}
.off{width:96px;color:#8193A6;flex:none;user-select:none}
.hx{display:flex;flex:none}
.head .hx i{color:#8193A6;cursor:default}
.hx i{font-style:normal;width:25px;text-align:center;cursor:text;border-radius:3px}
.hx i:nth-child(8){margin-right:8px}
.asc{display:flex;margin-left:18px;padding-left:12px;border-left:1px solid #EEF2F6;flex:none}
.asc i{font-style:normal;width:9px;text-align:center;cursor:text;color:#3E4F60}
i.g{color:#C0CAD4}
i.m{background:#FFF1C9;color:#6B4A00;font-weight:600}
i.hit{background:#D7E6F5}
i.sel{background:#CFE0F1}
i.cur{outline:2px solid #2B5C8A;outline-offset:-2px;background:#E7EFF7}
.view:not(:focus) i.cur{outline-color:#9DB8D3}
i.pend{background:#2B5C8A;color:#fff}
/* compare */
.cmp .hx i{width:23px}
.cmp .hx.b{margin-left:22px;padding-left:14px;border-left:1px solid #EEF2F6}
i.d{background:#FDECEA;color:#A3321F;font-weight:600}
i.o{background:repeating-linear-gradient(135deg,#F6E7C8 0 3px,#FFF8E8 3px 6px);color:#7A5400}
.row.dc{background:#FFF9F8!important}
.row.jump{border-top:1px dashed #C9D3DD}
.row.dc.focus{box-shadow:inset 3px 0 0 #C2412D}
.head{position:sticky;top:0;z-index:2;height:24px;white-space:pre;display:flex;padding-left:16px;background:#F7F9FB;border-bottom:1px solid #E1E7EE;color:#5B6B7C;font-size:12px;line-height:24px}
.verdict{font-size:15px;font-weight:700;margin:2px 0 4px}
.verdict.same{color:#1D6B43}.verdict.diff{color:#A3321F}
/* empty */
.empty{flex:1;display:grid;place-items:center;padding:24px}
.drop{width:min(560px,100%);border:1.5px dashed #B9C6D3;border-radius:14px;background:#fff;padding:34px 28px;text-align:center}
.drop h2{margin:0 0 6px;font-size:18px}.drop p{margin:0 0 16px;color:#5B6B7C}
.drop .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cmpslots{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%)}
.slot{border:1.5px dashed #B9C6D3;border-radius:12px;background:#fff;padding:20px;text-align:center}
.slot.filled{border-style:solid;border-color:#DCE3EA}
.slot b{display:block;font-size:13px;color:#5B6B7C;margin-bottom:4px}
.slot .nm{font-weight:600;margin-bottom:10px;word-break:break-all}
#dropAll{position:fixed;inset:0;z-index:50;background:rgba(43,92,138,.10);border:3px dashed #2B5C8A;display:grid;place-items:center;font-size:18px;font-weight:600;color:#2B5C8A;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:60;background:#14202C;color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
dialog{border:0;border-radius:12px;padding:20px;box-shadow:0 20px 50px -20px rgba(15,24,33,.45);max-width:420px}
dialog::backdrop{background:rgba(15,24,33,.3)}
dialog h4{margin:0 0 8px;font-size:15px}dialog p{margin:0 0 16px;color:#4A5B6C}
dialog .acts{display:flex;justify-content:flex-end;gap:8px}
kbd{font:11.5px ui-monospace,Consolas,monospace;border:1px solid #DCE3EA;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
@media (max-width:900px){main{grid-template-columns:1fr}aside.side{max-height:34vh;border-right:0;border-bottom:1px solid #E1E7EE}.brand .tag{display:none}}
.chips{display:contents}
.chip{display:inline-flex;align-items:stretch;border:1px solid #DCE3EA;border-radius:8px;background:#fff;overflow:hidden;max-width:280px}
.chip.on{border-color:#2B5C8A;background:#E7EFF7}
.chip button{border:0;background:none;cursor:pointer;font-size:13px;height:28px;color:inherit}
.chip-n{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip-n b{color:#2B5C8A;margin-right:6px}
.chip-n:hover{background:#F1F4F8}
.chip-x{width:30px;flex:none;color:#5B6B7C;border-left:1px solid #E1E7EE!important}
.chip-x:hover{background:#FDECEA;color:#A3321F}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#D99A00;margin-left:6px;vertical-align:middle}
.chip button:focus-visible{outline:2px solid #2B5C8A;outline-offset:-2px}
.cmp .hx i{cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="14" width="4" height="6" rx="2"/><rect x="6" y="4" width="4" height="6" rx="2"/><path d="M6 20h4"/><path d="M14 10h4"/><path d="M6 14h2v6"/><path d="M14 4h2v6"/></svg></span><strong>Hex/Bin Editor &amp; Compare</strong><span class="tag">Demo</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabView" aria-selected="true" data-t="解析／編輯|Inspect / edit"></button>
    <button class="tab" role="tab" id="tabCmp" aria-selected="false" data-t="比對|Compare"></button>
  </div>
  <span class="grow"></span>
  <button class="btn" id="bOpen" data-t="開啟檔案|Open file"></button>
  <div class="menu-wrap">
    <button class="btn" id="bExportBtn" aria-haspopup="true" aria-expanded="false" data-t="匯出 ▾|Export ▾"></button>
    <div class="menu" id="mExport" role="menu" hidden>
      <button role="menuitem" id="xBin"><b data-t="Binary（.bin）|Binary (.bin)"></b><small data-t="從起始位址到結尾，空隙補 0xFF|From the start address to the end; gaps filled with 0xFF"></small></button>
      <button role="menuitem" id="xIhex"><b data-t="Intel HEX（.hex）|Intel HEX (.hex)"></b><small data-t="保留原位址與空隙，含檢查碼|Keeps addresses and gaps, with checksums"></small></button>
      <button role="menuitem" id="xText"><b data-t="文字 Hex（.txt）|Text hex (.txt)"></b><small data-t="0x00, 0x01 … 每行 16 個|0x00, 0x01 … 16 per line"></small></button>
    </div>
  </div>
  <div class="lang" id="lang"><button data-l="zh">中文</button><button data-l="en">EN</button></div>
  <button class="ib close" id="bClose" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <input type="file" id="fA" hidden><input type="file" id="fB" hidden>
</header>

<main>
  <aside class="side" id="side"></aside>
  <section class="work" id="work"></section>
</main>

<div id="dropAll" hidden data-t="放開以開啟檔案|Drop to open the file"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><h4 id="dlgT"></h4><p id="dlgP"></p><div class="acts"><button class="btn" id="dlgNo"></button><button class="btn pri" id="dlgYes"></button></div></dialog>

<script>
'use strict';
/* =====================================================================
   Hex/Bin Editor & Compare: open .bin, Intel HEX or text hex; inspect,
   edit in place, export; compare two files address by address.
   Everything stays in this page; nothing is uploaded.
   ===================================================================== */
const $ = id => document.getElementById(id);
const HOST = (() => { try { return window.parent !== window && window.parent.afHexHost ? window.parent.afHexHost : null; } catch { return null; } })();
let LANG = HOST ? (HOST.lang === 'en' ? 'en' : 'zh') : (() => { try { return localStorage.getItem('hexbin-lang') || 'zh'; } catch { return 'zh'; } })();
const T = (zh, en) => (LANG === 'en' ? en : zh);
const MAX = 64 * 1024 * 1024;
const ROW = 22;

/* ---------- small helpers ---------- */
const h2 = n => n.toString(16).toUpperCase().padStart(2, '0');
const hx = (n, w = 8) => '0x' + n.toString(16).toUpperCase().padStart(w, '0');
const addrW = img => (img && img.base + img.data.length > 0x10000 ? 8 : 4);
const fmtN = n => n.toLocaleString('en-US');
const nB = n => (LANG === 'en' && n === 1 ? '1 byte' : `${fmtN(n)} bytes`);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) {
  if (HOST) { try { HOST.toast(msg); return; } catch { /* fall back */ } }
  const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600);
}
function download(name, data, type = 'application/octet-stream') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function ask(title, text, yes, no) {
  return new Promise(res => {
    const d = $('dlg'); $('dlgT').textContent = title; $('dlgP').textContent = text; $('dlgYes').textContent = yes; $('dlgNo').textContent = no;
    const done = v => { d.close(); res(v); }; $('dlgYes').onclick = () => done(true); $('dlgNo').onclick = () => done(false); d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal(); $('dlgNo').focus();
  });
}
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8, from = 0, to = u8.length) { let c = 0xFFFFFFFF; for (let i = from; i < to; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function sum8(u8, from = 0, to = u8.length) { let s = 0; for (let i = from; i < to; i++) s = (s + u8[i]) & 0xFF; return s; }
async function sha256(u8) { try { const d = await crypto.subtle.digest('SHA-256', u8); return [...new Uint8Array(d)].map(h2).join('').toLowerCase(); } catch { return null; } }

/* ---------- parsers ----------
   An image is { name, fmt, base, data: Uint8Array, known: Uint8Array | null (null = every byte present),
   records, errors[], start }. Addresses in the hex view are base + index. */
function parseIntelHex(text, name) {
  const chunks = [], errors = []; let upper = 0, seg = 0, records = 0, start = null, eof = false, lo = Infinity, hi = -1;
  const lines = text.split(/\r?\n/);
  for (let ln = 0; ln < lines.length; ln++) {
    const l = lines[ln].trim(); if (!l) continue;
    const where = T(`第 ${ln + 1} 行`, `line ${ln + 1}`);
    if (eof) { errors.push(T(`${where}：結束記錄 (01) 之後還有資料，已忽略`, `${where}: data after the end-of-file record (01), ignored`)); break; }
    if (l[0] !== ':' || !/^:[0-9A-Fa-f]+$/.test(l) || l.length % 2 === 0) { errors.push(T(`${where}：不是 Intel HEX 記錄`, `${where}: not an Intel HEX record`)); continue; }
    const b = l.slice(1).match(/../g).map(x => parseInt(x, 16));
    const [n, ah, al, type] = b;
    if (b.length !== n + 5) { errors.push(T(`${where}：長度欄位 ${n} 與實際資料不符`, `${where}: the length field ${n} does not match the data`)); continue; }
    if (b.reduce((s, x) => s + x, 0) & 0xFF) { errors.push(T(`${where}：檢查碼錯誤（應為 ${h2((256 - b.slice(0, -1).reduce((s, x) => s + x, 0) % 256) % 256)}）`, `${where}: checksum error (expected ${h2((256 - b.slice(0, -1).reduce((s, x) => s + x, 0) % 256) % 256)})`)); continue; }
    records++;
    const d = b.slice(4, 4 + n);
    if (type === 0) { const a = upper + seg + (ah << 8 | al); chunks.push([a, d]); lo = Math.min(lo, a); hi = Math.max(hi, a + n - 1); }
    else if (type === 1) eof = true;
    else if (type === 2) seg = (d[0] << 8 | d[1]) * 16;
    else if (type === 4) upper = (d[0] << 8 | d[1]) * 65536;
    else if (type === 3 || type === 5) start = d.reduce((s, x) => s * 256 + x, 0);
    else errors.push(T(`${where}：不支援的記錄類型 ${h2(type)}`, `${where}: unsupported record type ${h2(type)}`));
  }
  if (!eof && records) errors.push(T('缺少結束記錄 (:00000001FF)', 'Missing the end-of-file record (:00000001FF)'));
  if (hi < 0) throw Error(errors[0] || T('檔案裡沒有資料記錄', 'The file has no data records'));
  if (hi - lo + 1 > MAX) throw Error(T(`位址範圍 ${fmtN(hi - lo + 1)} bytes 超過 64 MB 上限`, `The address range ${fmtN(hi - lo + 1)} bytes is over the 64 MB limit`));
  const data = new Uint8Array(hi - lo + 1).fill(0xFF), known = new Uint8Array(hi - lo + 1);
  let overlaps = 0;
  for (const [a, d] of chunks) for (let i = 0; i < d.length; i++) { const k = a - lo + i; if (known[k] && data[k] !== d[i]) overlaps++; data[k] = d[i]; known[k] = 1; }
  if (overlaps) errors.push(T(`${overlaps} 個位址被不同記錄寫了不同的值（以最後一筆為準）`, `${overlaps} addresses were written twice with different values (the last one wins)`));
  return { name, fmt: 'ihex', base: lo, data, known: known.every(x => x) ? null : known, records, errors, start };
}
function parseTextHex(text, name) {
  const toks = text.replace(/\/\/.*|#.*|\/\*[\s\S]*?\*\//g, ' ').split(/[\s,;]+/).filter(Boolean);
  const bad = toks.filter(t => !/^(0x)?[0-9A-Fa-f]{1,2}$/i.test(t));
  if (bad.length) throw Error(T(`無法辨識的值：${bad.slice(0, 3).join('、')}${bad.length > 3 ? ' …' : ''}（每個位元組寫 00～FF 或 0x00～0xFF）`, `Values that are not bytes: ${bad.slice(0, 3).join(', ')}${bad.length > 3 ? ' …' : ''} (write 00 to FF or 0x00 to 0xFF)`));
  if (!toks.length) throw Error(T('檔案是空的', 'The file is empty'));
  return { name, fmt: 'text', base: 0, data: Uint8Array.from(toks, t => parseInt(t.replace(/^0x/i, ''), 16)), known: null, records: 0, errors: [], start: null };
}
async function readFile(f) {
  if (f.size > MAX) throw Error(T(`檔案 ${fmtN(f.size)} bytes 超過 64 MB 上限`, `The file is ${fmtN(f.size)} bytes, over the 64 MB limit`));
  const buf = new Uint8Array(await f.arrayBuffer());
  const head = new TextDecoder().decode(buf.slice(0, 64)).trimStart();
  const texty = buf.length && !buf.slice(0, 4096).some(b => b === 0 || (b < 9));
  if (/\.(hex|ihx|ihex|mcs|h86)$/i.test(f.name) || (texty && head[0] === ':')) {
    if (head[0] === ':') return parseIntelHex(new TextDecoder().decode(buf), f.name);
    if (texty) return parseTextHex(new TextDecoder().decode(buf), f.name);
  }
