<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDID Generator · Web Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232B5C8A%22 stroke-width=%222%22%3E%3Crect x=%222%22 y=%224%22 width=%2220%22 height=%2213%22 rx=%222%22/%3E%3Cpath d=%22M8 21h8M12 17v4%22/%3E%3C/svg%3E">
<style>
[hidden]{display:none !important}
/* tool icon and close button, the same as RSI BOM Converter */
.tool-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:#E7EFF7;color:#2B5C8A;flex:none;align-self:center}
.tool-icon svg{width:16px;height:16px}
.ib.close{width:32px;height:32px;display:inline-grid;place-items:center;border:0;border-radius:6px;background:transparent;cursor:pointer;color:#5B6B7C;flex:none;margin-left:2px}
.ib.close:hover{background:#EEF2F6;color:#14202C}
.ib.close svg{width:18px;height:18px}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Segoe UI",system-ui,sans-serif;font-size:14px;color:#14202C;background:#F3F5F8;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;background:#fff;border-bottom:1px solid #E1E7EE}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand b{font-size:17px;letter-spacing:.01em}
.tag{font-size:12px;color:#405366;background:#EEF2F6;border-radius:6px;padding:2px 8px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid #DCE3EA;border-radius:8px;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#F4F7FA;border-color:#C9D5E2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.byte:focus-visible,summary:focus-visible{outline:2px solid #2B5C8A;outline-offset:1px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:#F1F4F8}
.btn.primary{background:#2B5C8A;border-color:#2B5C8A;color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){background:#244E76}
.btn.big{height:44px;padding:0 20px;font-size:15px}
.tpl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:-4px 0 14px;font-size:12.5px;color:#5B6B7C}
.tpl b{color:#1F2D3A;font-weight:600}
.tpl .tag2{font-size:11px;padding:1px 7px;border-radius:9px;background:#EEF2F6;color:#4A5B6C}
.tpl .tag2.mine{background:#E7EFF7;color:#2B5C8A}
.tpl .tag2.warn{background:#FFF4DC;color:#7A5400}
.linkbtn{border:0;background:none;padding:2px 4px;margin:0 -4px;color:#2B5C8A;font:inherit;cursor:pointer;border-radius:4px;text-decoration:underline;text-underline-offset:2px;text-decoration-color:#A9C0D6}
.linkbtn:hover{text-decoration-color:currentColor}
.linkbtn:focus-visible{outline:2px solid #2B5C8A;outline-offset:1px}
.tpl .hint2{flex-basis:100%;color:#647282;font-size:12px}
.tpl code{font:12px ui-monospace,Consolas,monospace;background:#F1F4F8;padding:0 4px;border-radius:3px;color:#1F2D3A}
.btn svg{width:16px;height:16px;flex:none}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:270px;background:#fff;border:1px solid #DCE3EA;border-radius:10px;box-shadow:0 12px 32px rgba(20,32,44,.16);padding:6px}
.menu[hidden]{display:none}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:transparent;border-radius:7px;padding:8px 10px;cursor:pointer;text-align:left}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:#F1F4F8;outline:0}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu button b{font-weight:600;font-size:13.5px}.menu button small{font-size:12px;color:#5F7082}
.menu-sep{display:block;height:1px;background:#EDF1F4;margin:4px 2px}
.stale{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 0 12px;border-radius:9px;background:#FFF4E0;color:#6B4612;font-size:13px}
.stale[hidden]{display:none}
.stale .btn{height:28px;font-size:12.5px;padding:0 10px;margin-left:auto}
.count{font-size:12px;color:#5F7082;text-align:right}
.count.over{color:#9B3344;font-weight:700}
.drop{position:fixed;inset:0;z-index:90;background:rgba(43,92,138,.10);border:3px dashed #2B5C8A;display:grid;place-items:center;font-size:18px;font-weight:700;color:#1E3F6B;pointer-events:none}
.drop[hidden]{display:none}
.lang{display:inline-flex;padding:2px;border-radius:8px;background:#EEF2F6}
.lang button{border:0;background:transparent;border-radius:6px;height:28px;min-width:36px;cursor:pointer;color:#405366}
.lang button[aria-pressed=true]{background:#fff;color:#14202C;font-weight:600;box-shadow:0 1px 2px rgba(20,32,44,.12)}
main{max-width:1440px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){main{grid-template-columns:1fr}}
@media (max-width:640px){header.top{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:6px}header.top .grow{flex-basis:100%;height:0;order:1}header.top .brand{order:0}header.top>*:not(.brand):not(.grow){order:2}header.top .brand .tag{display:none}.menu{right:auto;left:0}}
.card{background:#fff;border:1px solid #E1E7EE;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 small{font-size:12px;font-weight:400;color:#5F7082}
.card p.sub{margin:0 0 12px;color:#5A6B7D;font-size:12.5px;line-height:1.5}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;align-items:center;gap:10px;margin:8px 0}
.row label{color:#33414F;font-size:13px}
.row .unit{color:#5F7082;font-size:12.5px}
.row input,.row select{width:100%;height:34px;border:1px solid #D5DEE8;border-radius:8px;padding:0 10px;background:#fff;text-align:right;font-variant-numeric:tabular-nums}
.row input[type=text]{text-align:left}
.row input.bad{border-color:#B3402E;background:#FFF7F7}
.row input:focus{border-color:#2B5C8A;box-shadow:0 0 0 3px rgba(43,92,138,.14);outline:0}
.err{grid-column:2/4;color:#9B3344;font-size:12px;margin-top:-4px}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:8px;background:#EEF2F6;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:6px;cursor:pointer;color:#405366;font-size:13px}
.seg button[aria-checked=true]{background:#fff;color:#14202C;font-weight:600;box-shadow:0 1px 2px rgba(20,32,44,.14)}
.segrow{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:10px;margin:8px 0}
.segrow label{color:#33414F;font-size:13px}
.total{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed #E1E7EE;font-size:12.5px;color:#5A6B7D}
.total b{color:#14202C;font-variant-numeric:tabular-nums}
.calc{display:flex;align-items:center;gap:8px;margin:2px 0 6px 160px;font-size:12.5px;color:#5A6B7D}
.calc button{height:28px;font-size:12.5px;padding:0 10px}
details.adv summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
details.adv summary::before{content:"▸";color:#5F7082;font-size:12px;transition:transform .15s}
details.adv[open] summary::before{transform:rotate(90deg)}
details.adv summary small{font-weight:400;font-size:12px;color:#5F7082}
.timing{display:grid;gap:10px;margin-top:6px}
.tbar{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;font-size:12px;color:#5A6B7D}
.tbar .bar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid #E1E7EE}
.tbar .bar span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-size:11.5px;min-width:2px}
.s-sync{background:#2B5C8A;color:#fff}.s-bp{background:#BCD0E6;color:#1E3F6B}.s-act{background:#E6F3EF;color:#1F6B57}.s-fp{background:#F6E6CC;color:#6B4612}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#5A6B7D}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gen{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gen .note{font-size:12.5px;color:#5A6B7D}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:13px;line-height:1.5}
.banner.err{background:#FBEBEE;color:#7A2333;border:1px solid #F1C8CF}
.banner b{display:block}
.blocks{display:grid;gap:14px}
.blk h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
.ok{color:#1F6B57;background:#E6F3EF;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:700}
.bad{color:#9B3344;background:#FBEBEE;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:700}
.grid{display:grid;grid-template-columns:34px repeat(16,minmax(0,1fr));gap:2px;font-size:12px}
.grid .hd{color:#687685;text-align:center;font-size:11px;padding:2px 0}
.byte{border:0;border-radius:4px;padding:4px 0;text-align:center;cursor:default;font-variant-numeric:tabular-nums;background:#F4F7FA;color:#22313F}
.byte.r-hdr{background:#E8ECF0}.byte.r-ven{background:#EDE8F7}.byte.r-basic{background:#E0EAF6}.byte.r-color{background:#F1F4F8}.byte.r-std{background:#F4F7FA;color:#647282}
.byte.r-dtd{background:#E6F3EF;color:#0F5148}.byte.r-name{background:#FFF4E0;color:#6B4612}.byte.r-range{background:#FBEBEE;color:#7A2333}.byte.r-sum{background:#2B5C8A;color:#fff;font-weight:700}.byte.r-ext{background:#DCE3EA}
.byte.r-cea{background:#EEF2F6}.byte.r-pad{background:transparent;color:#B4BEC9}
.byte.hl{outline:2px solid #2563EB;outline-offset:-1px}
.inspect{min-height:20px;font-size:12.5px;color:#405366;margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #E1E7EE;margin:0 0 10px}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:#5A6B7D;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:#14202C;font-weight:700;border-bottom-color:#2B5C8A}
textarea.code{width:100%;min-height:200px;border:1px solid #D5DEE8;border-radius:9px;padding:10px 12px;resize:vertical;font-size:12.5px;line-height:1.55;background:#FBFCFD;white-space:pre;overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
dl.dec{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:13px}
dl.dec dt{color:#5A6B7D}dl.dec dd{margin:0;font-variant-numeric:tabular-nums}
.toast{position:fixed;right:22px;bottom:22px;z-index:60;background:#1E2935;color:#F1F5F9;padding:10px 16px;border-radius:10px;box-shadow:0 10px 26px rgba(15,23,42,.25);font-size:13px;max-width:min(640px,90vw)}
.toast[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.dialog{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.3);width:min(420px,94vw);padding:20px}
.dialog h3{margin:0 0 8px;font-size:16px}
.dialog p{margin:0 0 16px;color:#405366;line-height:1.55}
.dialog .actions{justify-content:flex-end}
footer{max-width:1440px;margin:0 auto;padding:0 18px 22px;display:flex;gap:16px;align-items:center;color:#687685;font-size:12px}
footer a{color:#2B5C8A}
.hint{font-size:12px;color:#5F7082;line-height:1.5;margin:8px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></span><b>EDID Generator</b><span class="tag" data-t="Web Demo|Web Demo"></span></div>
  <div class="grow"></div>
  <div class="menu-wrap"><button class="btn ghost" id="mOpenBtn" type="button" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg><span data-t="開啟|Open"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="menu" id="mOpen" role="menu" hidden>
      <button type="button" role="menuitem" id="bExample"><b data-t="載入範例 example.ini|Load example.ini"></b><small data-t="Demo · 1920×1080 · 60 Hz|Demo · 1920×1080 · 60 Hz"></small></button>
      <button type="button" role="menuitem" id="bImportIni"><b data-t="匯入設定 .ini|Import settings (.ini)"></b><small data-t="時序與進階欄位|Timing and advanced fields"></small></button>
      <button type="button" role="menuitem" id="bImportTpl"><b data-t="上傳 Python 範本|Upload a Python template"></b><small data-t="取代內建 origin.py，產生 main.py 時使用|Replaces the built-in origin.py for main.py"></small></button>
      <button type="button" role="menuitem" id="bImportBin"><b data-t="匯入 EDID 檔|Import an EDID file"></b><small data-t=".bin、.hex（文字或 Intel HEX）|.bin, .hex (text or Intel HEX)"></small></button>
    </div></div>
  <div class="menu-wrap"><button class="btn ghost" id="mExportBtn" type="button" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg><span data-t="匯出|Export"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="menu" id="mExport" role="menu" hidden>
      <button type="button" role="menuitem" id="bExportIni"><b data-t="設定 .ini|Settings (.ini)"></b><small data-t="可再匯入，桌面版也能讀|Re-importable; the desktop tool reads it too"></small></button>
      <span class="menu-sep" role="separator"></span>
      <button type="button" role="menuitem" data-need="edid" id="xBin"><b>EDID .bin</b><small data-t="二進位，燒錄器與 EEPROM 工具用|Binary, for programmers and EEPROM tools"></small></button>
      <button type="button" role="menuitem" data-need="edid" id="xHex"><b data-t="EDID .hex（文字）|EDID .hex (text)"></b><small data-t="0x 逗號格式，與匯入相容|0x, comma-separated; re-importable"></small></button>
      <button type="button" role="menuitem" data-need="edid" id="xIhex"><b>Intel HEX (.hex)</b><small data-t="燒錄器常用的位址＋檢查碼格式|Address + checksum records used by programmers"></small></button>
      <button type="button" role="menuitem" data-need="edid" id="xC"><b data-t="C 陣列 (.h)|C array (.h)"></b><small data-t="韌體直接 #include|Ready to #include in firmware"></small></button>
      <span class="menu-sep" role="separator"></span>
      <button type="button" role="menuitem" data-need="edid" id="xPy"><b data-t="Python 程式碼（main.py）|Python code (main.py)"></b><small data-t="同「產生 Python 程式碼」|Same as Generate Python Code"></small></button>
    </div></div>
  <button class="btn ghost" id="bReset" type="button" data-t="全部重設|Reset all"></button>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
  <button class="ib close" id="bClose" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <input type="file" id="fIni" accept=".ini" hidden><input type="file" id="fBin" accept=".bin,.hex" hidden><input type="file" id="fTpl" accept=".py,.txt" hidden>
</header>

<main>
  <section aria-label="Inputs">
    <div class="card">
      <h2 data-t="基本資訊|General"></h2>
      <p class="sub" data-t="產生 EDID 基本區塊（128 bytes）與 CEA 擴充區塊（128 bytes），並產出燒錄用的 Python 程式碼。|Builds the EDID base block (128 bytes) and a CEA extension block (128 bytes), and the Python code that writes them."></p>
      <div class="row"><label for="model_name" data-t="型號 Model Name|Model Name"></label><input type="text" id="model_name" data-p="選填，例如 Demo|Optional, e.g. Demo"><span></span></div>
      <div class="row"><label for="display_name" data-t="顯示器名稱（EDID）|Display name (EDID)"></label><input type="text" id="display_name" maxlength="13" spellcheck="false" data-p="空白＝使用型號|Empty = model name"><span class="count" id="dnCount">0/12</span></div>
      <div class="segrow"><label data-t="輸出格式|Output Format"></label><div class="seg" id="sFormat" role="radiogroup"><button type="button" role="radio" data-v="OLDI">OLDI</button><button type="button" role="radio" data-v="VESA">VESA</button></div></div>
      <div class="segrow"><label data-t="LVDS 埠數|LVDS Ports"></label><div class="seg" id="sPorts" role="radiogroup"><button type="button" role="radio" data-v="1_port" data-t="1 埠|1 port"></button><button type="button" role="radio" data-v="2_port" data-t="2 埠|2 ports"></button></div></div>
      <div class="segrow"><label data-t="A／B 埠交換|A/B ports"></label><div class="seg" id="sSwap" role="radiogroup"><button type="button" role="radio" data-v="Ports A and B not Swapped" data-t="不交換|Normal"></button><button type="button" role="radio" data-v="Ports A and B Swapped" data-t="交換 A／B|Swapped"></button></div></div>
    </div>

    <div class="card">
      <h2 data-t="水平時序|Horizontal Timings"></h2>
      <div class="row"><label for="h_active" data-t="有效像素 Active|Horizontal Active"></label><input id="h_active" inputmode="numeric" data-p="H.Active|H.Active"><span class="unit">px</span></div>
      <div class="row"><label for="h_fp" data-t="前廊 Front Porch|Front Porch"></label><input id="h_fp" inputmode="numeric" data-p="H.Front_Porch|H.Front_Porch"><span class="unit">px</span></div>
      <div class="row"><label for="h_bp" data-t="後廊 Back Porch|Back Porch"></label><input id="h_bp" inputmode="numeric" data-p="H.Back_Porch|H.Back_Porch"><span class="unit">px</span></div>
      <div class="row"><label for="h_sync" data-t="同步寬度 Sync Width|Sync Width"></label><input id="h_sync" inputmode="numeric" data-p="H.Sync_Width|H.Sync_Width"><span class="unit">px</span></div>
      <div class="total" id="hTotal"></div>
    </div>

    <div class="card">
      <h2 data-t="垂直時序|Vertical Timings"></h2>
      <div class="row"><label for="v_active" data-t="有效行數 Active|Vertical Active"></label><input id="v_active" inputmode="numeric" data-p="V.Active|V.Active"><span class="unit" data-t="行|lines"></span></div>
      <div class="row"><label for="v_fp" data-t="前廊 Front Porch|Front Porch"></label><input id="v_fp" inputmode="numeric" data-p="V.Front_Porch|V.Front_Porch"><span class="unit" data-t="行|lines"></span></div>
      <div class="row"><label for="v_bp" data-t="後廊 Back Porch|Back Porch"></label><input id="v_bp" inputmode="numeric" data-p="V.Back_Porch|V.Back_Porch"><span class="unit" data-t="行|lines"></span></div>
      <div class="row"><label for="v_sync" data-t="同步寬度 Sync Width|Sync Width"></label><input id="v_sync" inputmode="numeric" data-p="V.Sync_Width|V.Sync_Width"><span class="unit" data-t="行|lines"></span></div>
      <div class="total" id="vTotal"></div>
    </div>

    <div class="card">
      <h2 data-t="EDID 一般資訊|EDID General Info"></h2>
      <div class="row"><label for="frame_rate" data-t="更新率 Frame Rate|Frame Rate"></label><input id="frame_rate" inputmode="decimal" data-p="Frame Rate|Frame Rate"><span class="unit">Hz</span></div>

const ORIGIN = "from machine import Pin, I2C, Timer, PWM\nimport time\nimport utime\nimport sys\n\nPWM_DIM = Pin(2, Pin.OUT)\nKey_Up = Pin(13, Pin.IN, Pin.PULL_UP)\nKey_Down = Pin(14, Pin.IN, Pin.PULL_UP)\n\nSW1 = Pin(3, Pin.IN, Pin.PULL_DOWN)\nSW2 = Pin(4, Pin.IN, Pin.PULL_DOWN)\nSW3 = Pin(5, Pin.IN, Pin.PULL_DOWN)\nSW4 = Pin(6, Pin.IN, Pin.PULL_DOWN)\n\n# I2C Initialize\ni2c = I2C(1, scl=Pin(27), sda=Pin(26), freq=300000)  # 300KHz\n\n# Define Address\nTX_WriteDeviceAddress = 0x80\nTX_ReadDeviceAddress = 0x81\nRX_WriteDeviceAddress = 0x90\nRX_ReadDeviceAddress = 0x91\n\n# Define Global Parameters.\nLVDS_Port = 2\n\n# Mode Paramerter.\nflag_upstep = False\nflag_downstep = False\n\n# Interrupt Handler\ndef handle_key_up(pin):\n    global flag_upstep\n    flag_upstep = True\n\ndef handle_key_down(pin):\n    global flag_downstep\n    flag_downstep = True\n\n# Setting Button Interrupt\nKey_Up.irq(trigger=Pin.IRQ_FALLING, handler=handle_key_up)\nKey_Down.irq(trigger=Pin.IRQ_FALLING, handler=handle_key_down)\n\n# Delay Function\ndef delay_ms(ms):\n    time.sleep_ms(ms)\n\ndef i2c_write(address, data):\n    i2c.writeto(address, bytes(data))\n    delay_ms(10)\n\ndef i2c_read(address, num):\n    return i2c.readfrom(address, num)\n\n\ndef write_data(device_addr, register_addr, data):\n    try:\n        i2c.writeto_mem(device_addr, register_addr, bytes(data))\n        return True\n    except:\n        return False\n\ndef read_data(device_addr, register_addr, num):\n    try:\n        return i2c.readfrom_mem(device_addr, register_addr, num)\n    except:\n        return None\n\n# Main Function.\ni2c_scan=1\ndef main():\n\n    delay_ms(100) # Waiting Power-Up\n    \n    if i2c_scan:\n        print('Scan i2c bus...')\n        devices = i2c.scan()              # scan for devices(7bit)\n        if len(devices) == 0:\n            print(\"No i2c device !\")\n            print(\"Exit !\")\n            sys.exit(1)\n        else:\n            print('i2c devices found:',len(devices))\n            for device in devices:  \n                print(\"Hex address(8bit): \",hex(device*2),\" | Hex address(7bit): \",hex(device))\n    else:\n        pass\n\n    \n    # Initialize.\n    print('Dual Link Initialize...')\n    Dual_Link_Initial()\n    delay_ms(100)\n    print('TX Initialize...')\n    TX_Initial()\n    delay_ms(100)\n    \n    print('EDID Initialize...')\n    EDID_Init()\n    delay_ms(100)\n    \n    print('RX Initialize...')\n    RX_Forward_Init()\n    print('Initing Done')\n    delay_ms(100)\n    print('EDID Initialize...')\n    EDID_Init()\n    delay_ms(10)\n    \n    PWMI_Feq=200\n    PWMI_Duty=100\n    PWM2(PWMI_Feq,PWMI_Duty)\n    \n    while True:\n        for button in buttons:\n            event,BTN_ID=button.check()\n            if event is None:\n                utime.sleep_ms(10)\n            else:   \n                if BTN_ID==3 and event==1:\n                    PWMI_Duty=PWMI_Duty-10\n                    if PWMI_Duty>100:\n                        PWMI_Duty=100\n                    elif PWMI_Duty<0:\n                        PWMI_Duty=0\n                    PWM2(PWMI_Feq,PWMI_Duty) \n\n                          \n                elif BTN_ID==4 and event==1:\n                    PWMI_Duty=PWMI_Duty+10\n                    if PWMI_Duty>100:\n                        PWMI_Duty=100\n                    elif PWMI_Duty<0:\n                        PWMI_Duty=0\n                    PWM2(PWMI_Feq,PWMI_Duty)\n\n#Dual_Link_Initialize   \ndef Dual_Link_Initial():\n    \n    # Initialize TX/RX Address\n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x00,0x80]))\n    i2c.writeto_mem(0x90>>1,0x00,bytearray([0x00,0x90]))\n    # Set TX/RX Speed 6Gbps\n    i2c.writeto_mem(0x90>>1,0x00,bytearray([0x01,0x02]))\n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x01,0x48]))\n    # Set RX Dual Link\n    i2c.writeto_mem(0x90>>1,0x00,bytearray([0x10,0x00]))\n    # Set TX Dual Link\n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x10,0x00]))\n    # Reset One Shot\n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x10,0x20]))\n\n    delay_ms(20)\n\n# Tx_Initialize\ndef TX_Initial():\n    \n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x02,0x43]))\n    i2c.writeto_mem(0x80>>1,0x01,bytearray([0x40,0x20]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x12,0xA3]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x06,0xa3]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x18,0x84])) \n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x1b,0xa3]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x27,0xA3]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x1e,0xa3]))\n    i2c.writeto_mem(0x80>>1,0x01,bytearray([0x17,0xa3]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x15,0xa3]))\n    \n    pass\n\n#Rx_Initialize\ndef RX_Forward_Init():\n    \n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x21,0x81]))\n    i2c.writeto_mem(0x90>>1,0x00,bytearray([0x02,0x43]))\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0x40,0x20]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x27,0x80]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x18,0xa3]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x22,0xab]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x23,0x49]))\n    \n    #LANE SELECT\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0xD0,0x00])) #00\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0xD1,0x11])) #11\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0xD2,0x44])) #44\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0xD3,0x33])) #33\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0xD4,0x22])) #22\n\n    # Generate code - OLDI Setting\n    # ====================================================== #\n    \n    # ====================================================== #\n    i2c.writeto_mem(0x90>>1,0x01,bytearray([0xcf,0x00]))\n    i2c.writeto_mem(0x90>>1,0x04,bytearray([0x58,0x28]))\n    i2c.writeto_mem(0x90>>1,0x04,bytearray([0x59,0x68]))\n    i2c.writeto_mem(0x90>>1,0x04,bytearray([0x3E,0xB3]))\n    i2c.writeto_mem(0x90>>1,0x04,bytearray([0x3F,0x72]))\n    i2c.writeto_mem(0x90>>1,0x05,bytearray([0x58,0x28]))\n    i2c.writeto_mem(0x90>>1,0x05,bytearray([0x59,0x68]))\n    i2c.writeto_mem(0x90>>1,0x05,bytearray([0x3E,0xB3]))\n    i2c.writeto_mem(0x90>>1,0x05,bytearray([0x3F,0x72]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x12,0x80]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x1e,0x80]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x21,0x80]))\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x15,0x80]))\n    \n    \n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x09,0x90]))  # LED_EN Open GPIO3 - 0x209\n    delay_ms(10)\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x0C,0x90]))  # GRB Open GPIO4 - 0x20C \n    delay_ms(10)\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x0C,0x80]))  # GRB Close GPIO4 - 0x20C \n    delay_ms(1)\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x0C,0x90]))  # GRB Open GPIO4 - 0x20C \n    delay_ms(10)\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x21,0x90]))  # MUTE/STBYB Open GPIO11 - 0x221\n    delay_ms(10)\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x06,0x90]))  # BIST Open GPIO2 - 0x206\n    delay_ms(500)\n    i2c.writeto_mem(0x90>>1,0x02,bytearray([0x06,0x80]))  # BIST Close GPIO2 - 0x206\n    delay_ms(10)\n\n    pass\n\n#EDID_Initialize\ndef EDID_Init():\n\n    i2c.writeto_mem(0x80>>1,0x20,bytearray([0xf5,0x00]))\n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x01,0x88]))\n    i2c.writeto_mem(0x80>>1,0x02,bytearray([0x06,0xa3]))\n    i2c.writeto_mem(0x80>>1,0x20,bytearray([0xf5,0x01]))\n    i2c.writeto_mem(0x80>>1,0x00,bytearray([0x1a,0x03]))\n\n    # ========================================================================= #\n    # === EDID Data Begin ===\n    \n\n\nDEBOUNCE_TIME = 0.02           \nLONG_PRESS_TIME = 1            \nDOUBLE_PRESS_INTERVAL = 0.5    \n\nclass Button:\n    def __init__(self, pin_number, button_id, single_press_callback, double_press_callback, long_press_callback):\n        \"\"\"\n        initial the button object\n        :param pin_number: button pin number\n        :param button_id: button id\n        :param single_press_callback: single press callback function\n        :param double_press_callback: double press callback function\n        :param long_press_callback: long press callback function\n        \"\"\"\n        self.pin = Pin(pin_number, Pin.IN, Pin.PULL_UP)\n        self.button_id = button_id\n        self.single_press_callback = single_press_callback\n        self.double_press_callback = double_press_callback\n        self.long_press_callback = long_press_callback\n        \n        # status variables\n        self.press_count = 0\n        self.last_press_time = 0\n        self.press_time = 0\n        self.pressed = False\n        self.waiting_for_double = False\n\n    def debounce(self):\n        \"\"\"\n        debounce function to filter the button noise\n        :return: True if the button is pressed\n        \"\"\"\n\n        time.sleep(DEBOUNCE_TIME)\n        return not self.pin.value()\n\n    def reset_press(self):\n        \"\"\"\n        reset the press status\n        \"\"\"\n        self.press_count = 0\n        self.last_press_time = 0\n        self.press_time = 0\n        self.pressed = False\n        self.waiting_for_double = False\n\n    def check(self):\n        \"\"\"\n        button check function:\n        - detect button press and release\n        - judge single press, double press and long press event\n        - return event type and button id\n        \"\"\"\n        current_time = time.time()\n        \n        # check button press\n        if not self.pin.value():  # button pressed\n            if not self.pressed:  # button pressed first time\n                if self.debounce():  # debounce\n                    self.pressed = True\n                    self.press_time = current_time\n                    self.press_count += 1\n                    self.last_press_time = self.press_time\n\n        else:  # button released\n            if self.pressed:\n                self.pressed = False\n                '''\n                press_duration = current_time - self.press_time\n                if press_duration >= LONG_PRESS_TIME:\n                    # long press event\n                    self.long_press_callback(self.button_id)\n                    self.reset_press()\n                    return 10, self.button_id\n                else:\n                    self.waiting_for_double = True  # wait for double press\n                    self.press_time = current_time  # update press time\n                '''\n                self.single_press_callback(self.button_id)\n                self.reset_press()\n                return 1, self.button_id\n        # check double press\n        if self.waiting_for_double:\n            if (current_time - self.last_press_time) > DOUBLE_PRESS_INTERVAL:\n                '''\n                if self.press_count >= 2:\n                    # double press event\n                    self.double_press_callback(self.button_id)\n                    self.reset_press()\n                    return 2, self.button_id\n                elif self.press_count == 1:\n                    # single press event\n                    self.single_press_callback(self.button_id)\n                    self.reset_press()\n                    return 1, self.button_id\n                '''\n                self.single_press_callback(self.button_id)\n                self.reset_press()\n                return 1, self.button_id\n        # if no event detected return None\n        return None, None\n\n\n# event callback functions\ndef single_press_action(button_id):\n    #print(\"Button {} single press triggered!\".format(button_id))\n    print(\"Button {}:\".format(button_id))\ndef double_press_action(button_id):\n    #print(\"Button {} double press triggered!\".format(button_id))\n    print(\"Button {}:\".format(button_id))\ndef long_press_action(button_id):\n    #print(\"Button {} long press triggered!\".format(button_id))\n    print(\"Button {}:\".format(button_id))\n# create button objects\nbuttons = [\n    Button(pin_number=7, button_id=1, \n           single_press_callback=single_press_action,\n           double_press_callback=double_press_action,\n           long_press_callback=long_press_action),\n    Button(pin_number=13, button_id=2, \n           single_press_callback=single_press_action,\n           double_press_callback=double_press_action,\n           long_press_callback=long_press_action),\n    Button(pin_number=14, button_id=3, \n           single_press_callback=single_press_action,\n           double_press_callback=double_press_action,\n           long_press_callback=long_press_action),\n    Button(pin_number=15, button_id=4, \n           single_press_callback=single_press_action,\n           double_press_callback=double_press_action,\n           long_press_callback=long_press_action),\n    # add more buttons here if needed\n]\n\ndef PWM2(freq,value):\n    pwm2 = PWM(Pin(2)) # Backlight Output.\n    pwm2.freq(freq)\n    if value>=100:\n        value=100\n    data=int (value*65536/100)       \n    pwm2.duty_u16(data)\n\n# Run Main\nmain()\n\n\n\n";

const BASE = [0x00,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0x00, 0x55,0x6E,0x00,0x00,0x00,0x00,0x90,0x00, 0x00,0x00,0x01,0x03,0x80,0x00,0x00,0x78, 0x0A,0x01,0x01,0x01,0x01,0x01,0x01,0x01, 0x01,0x01,0x01,0x00,0x00,0x00,0x01,0x01, 0x01,0x01,0x01,0x01,0x01,0x01,0x01,0x01, 0x01,0x01,0x01,0x01,0x01,0x01,0x01,0x01, 0x01,0x01,0x01,0x01,0x01,0x01,0x01,0x01, 0x01,0x01,0x01,0x01,0x01,0x01,0x01,0x01,

function buildEdid(t) {

  e[57] = hb & 0xFF;
  e[58] = (((t.horizontal_active >> 8) & 0x0F) << 4) | ((hb >> 8) & 0x0F);
  e[59] = t.vertical_active & 0xFF;
  const vb = t.vertical_front_porch + t.vertical_back_porch + t.vertical_sync_width;
  e[60] = vb & 0xFF;
  e[61] = (((t.vertical_active >> 8) & 0x0F) << 4) | ((vb >> 8) & 0x0F);      // fixed: the source masked with 0xFF
  e[62] = t.horizontal_front_porch & 0xFF;
  e[63] = t.horizontal_sync_width & 0xFF;

  e[65] = (((t.horizontal_front_porch >> 8) & 0x03) << 6) | (((t.horizontal_sync_width >> 8) & 0x03) << 4) | (((t.vertical_front_porch >> 4) & 0x03) << 2) | ((t.vertical_sync_width >> 4) & 0x03);

const displayText = arr => { const rows = []; for (let i = 0; i < arr.length; i += 16) rows.push(arr.slice(i, i + 16).join(', ')); return rows.join(',\n'); };

/* ---------- live hints: totals, pixel clock, timing bars ---------- */
function updateLive() {
  const d = inputData();
  const ht = d.horizontal_active + d.horizontal_front_porch + d.horizontal_back_porch + d.horizontal_sync_width;
  const vt = d.vertical_active + d.vertical_front_porch + d.vertical_back_porch + d.vertical_sync_width;
  $('hTotal').innerHTML = `<span>${T('總寬', 'Total')} <b>${ht}</b> px</span><span>${T('遮沒', 'Blanking')} <b>${ht - d.horizontal_active}</b> px</span>${d.pixel_clock > 0 && ht ? `<span>${T('水平頻率', 'H freq')} <b>${(d.pixel_clock * 1000 / ht).toFixed(2)}</b> kHz</span>` : ''}`;
  $('vTotal').innerHTML = `<span>${T('總行數', 'Total')} <b>${vt}</b> ${T('行', 'lines')}</span><span>${T('遮沒', 'Blanking')} <b>${vt - d.vertical_active}</b> ${T('行', 'lines')}</span>${d.pixel_clock > 0 && ht && vt ? `<span>${T('實際更新率', 'Actual refresh')} <b>${(d.pixel_clock * 1e6 / ht / vt).toFixed(2)}</b> Hz</span>` : ''}`;
  const pc = ht && vt && d.frame_rate > 0 ? (ht * vt * d.frame_rate / 1e6).toFixed(2) : null;
  $('calcText').textContent = pc ? T(`依時序計算為 ${pc} MHz`, `From the timing: ${pc} MHz`) + (Number($('pixel_clock').value) && $('pixel_clock').value.trim() !== pc ? T('（與目前值不同）', ' (differs from the value above)') : '') : T('填入時序與更新率即可計算。', 'Fill in the timing and frame rate to calculate.');
  bar('hBar', [[d.horizontal_sync_width, 's-sync', 'Sync'], [d.horizontal_back_porch, 's-bp', 'BP'], [d.horizontal_active, 's-act', 'Active'], [d.horizontal_front_porch, 's-fp', 'FP']]);
  bar('vBar', [[d.vertical_sync_width, 's-sync', 'Sync'], [d.vertical_back_porch, 's-bp', 'BP'], [d.vertical_active, 's-act', 'Active'], [d.vertical_front_porch, 's-fp', 'FP']]);
}
function bar(id, parts) {
  const el = $(id), total = parts.reduce((s, p) => s + Math.max(0, p[0]), 0);
  el.innerHTML = '';
  if (!total) { el.innerHTML = `<span style="flex:1;color:#687685">${T('尚未輸入', 'Nothing entered yet')}</span>`; return; }
  for (const [v, cls, lab] of parts) { if (v <= 0) continue; const s = document.createElement('span'); s.className = cls; s.style.flex = String(Math.max(v / total, 0.012)); s.title = `${lab}: ${v}`; s.textContent = v / total > 0.06 ? `${lab} ${v}` : ''; el.append(s); }
}

const calcClock = () => { const v = id => $(id).value.trim(), ints = ['h_active', 'h_fp', 'h_bp', 'h_sync', 'v_active', 'v_fp', 'v_bp', 'v_sync']; if (ints.some(id => !/^[+-]?\d+$/.test(v(id))) || !(parseFloat(v('frame_rate')) > 0)) return null; const n = id => parseInt(v(id), 10); return ((n('h_active') + n('h_fp') + n('h_bp') + n('h_sync')) * (n('v_active') + n('v_fp') + n('v_bp') + n('v_sync')) * parseFloat(v('frame_rate')) / 1e6).toFixed(2); };

$('bCalc').onclick = () => {   // controllers/edid_controller.py handle_calculate_pixel_clock
  const v = id => $(id).value.trim();
  const ints = ['h_active', 'h_fp', 'h_bp', 'h_sync', 'v_active', 'v_fp', 'v_bp', 'v_sync'];
  const bad = ints.find(id => !/^[+-]?\d+$/.test(v(id))) || (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(v('frame_rate')) ? 'frame_rate' : null);
  if (bad) { showErrors([T('無法計算 Pixel Clock：請先填入所有水平／垂直時序與更新率（整數）。', 'Error calculating Pixel Clock: fill in every horizontal / vertical timing and the frame rate.')]); $(bad).classList.add('bad'); $(bad).focus(); return; }
  const n = id => parseInt(v(id), 10);
  const th = n('h_active') + n('h_fp') + n('h_bp') + n('h_sync'), tv = n('v_active') + n('v_fp') + n('v_bp') + n('v_sync');
  $('pixel_clock').value = (th * tv * parseFloat(v('frame_rate')) / 1e6).toFixed(2);
  showErrors([]); updateLive(); toast(T(`Pixel Clock = ${$('pixel_clock').value} MHz`, `Pixel Clock = ${$('pixel_clock').value} MHz`));
};

/* ---------- generate ---------- */
function setStale(on) { state.stale = !!on && !!state.edid && state.fromInputs; $('stale').hidden = !state.stale; }
function setEdid(arr, src) {
  state.fromInputs = src === T('由時序產生', 'generated'); setStale(false); $('textWarn').hidden = true;
  state.edid = arr; $('edidText').value = displayText(arr);
  state.canPy = true; $('bPy').disabled = false;
  renderMap(); renderDecoded();
  $('edidLen').textContent = T(`${arr.length} bytes · ${src}`, `${arr.length} bytes · ${src}`);
}
function generate() {
  // Pixel Clock left empty: work it out from the timing instead of stopping with an error
  if (!$('pixel_clock').value.trim()) { const c = calcClock(); if (c) { $('pixel_clock').value = c; toast(T(`Pixel Clock 未填，已依時序算出 ${c} MHz。`, `Pixel Clock was empty; calculated ${c} MHz from the timing.`)); updateLive(); } }
  const d = inputData(), errs = validate(d);
  showErrors(errs);
  if (errs.length) { document.querySelector('input.bad')?.focus(); return; }
  setEdid(buildEdid(d), T('由時序產生', 'generated'));
  if ($('pixel_clock').value.trim()) toast(T('已產生 EDID（256 bytes，含 CEA 擴充區塊）。', 'EDID generated (256 bytes with the CEA extension).'));
}

    `horizontal_active = ${d.horizontal_active}`, `horizontal_front_porch = ${d.horizontal_front_porch}`, `horizontal_back_porch = ${d.horizontal_back_porch}`, `horizontal_sync_width = ${d.horizontal_sync_width}`,
    `vertical_active = ${d.vertical_active}`, `vertical_front_porch = ${d.vertical_front_porch}`, `vertical_back_porch = ${d.vertical_back_porch}`, `vertical_sync_width = ${d.vertical_sync_width}`,
    `week_number = ${d.week_number}`, `year_number = ${d.year_number}`, `max_h_image_size = ${d.max_h_image_size}`, `max_v_image_size = ${d.max_v_image_size}`,
    `interlaced = ${d.interlaced}`, `sound = ${d.sound}`, `output_type = ${d.output_type}`, `vsync_polarity = ${d.vsync_polarity}`, `hsync_polarity = ${d.hsync_polarity}`, '', ''];
  download(`${(d.model_name || 'edid').replace(/[\\/:*?"<>|]+/g, '_')}.ini`, lines.join('\n'));
  toast(T('已匯出 .ini（含生產週）。', 'Exported the .ini (including the week number).'));
};

/* ---------- .bin / .hex import ---------- */
$('bImportBin').onclick = () => { $('fBin').value = ''; $('fBin').click(); };
$('fBin').onchange = () => { const f = $('fBin').files[0]; if (f) importEdidFile(f); };
async function importEdidFile(f) {
  try {
    let bytes;
    if (/\.bin$/i.test(f.name)) bytes = [...new Uint8Array(await f.arrayBuffer())];
    else if (/\.hex$/i.test(f.name) && /^\s*:/.test(await f.text())) bytes = parseIntelHex(await f.text());
    else if (/\.hex$/i.test(f.name)) {
      const parts = (await f.text()).trim().replace(/,/g, ' ').replace(/0x/g, '').replace(/\n/g, ' ').split(/\s+/).filter(Boolean);
      bytes = parts.map(p => { if (!/^[0-9a-f]+$/i.test(p) || parseInt(p, 16) > 255) throw Error(T(`檔案中有無效的十六進位值：${p}`, `Invalid hex value in the file: ${p}`)); return parseInt(p, 16); });
    } else throw Error(T('只接受 .bin 或 .hex 檔。', 'Only .bin or .hex files are accepted.'));
    if (!bytes.length) throw Error(T('檔案是空的。', 'The file is empty.'));
    showErrors([]); setEdid(bytes.map(hex2), f.name); toast(T(`已匯入 EDID 檔：${f.name}`, `Imported EDID file: ${f.name}`));
  } catch (err) { showErrors([T(`讀取 EDID 檔失敗：${err.message}`, `Error reading EDID file: ${err.message}`)]); }
}

function parseIntelHex(text) {
  const mem = [];
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.trim(); if (!l) continue;
    if (!/^:[0-9A-F]+$/i.test(l) || l.length < 11) throw Error(T(`Intel HEX 格式不正確：${l.slice(0, 20)}`, `Not valid Intel HEX: ${l.slice(0, 20)}`));
    const b = l.slice(1).match(/../g).map(x => parseInt(x, 16));
    if (b.reduce((s, x) => s + x, 0) % 256 !== 0) throw Error(T(`Intel HEX 檢查碼錯誤：${l.slice(0, 20)}`, `Intel HEX checksum error: ${l.slice(0, 20)}`));
    const [n, hi, lo, type] = b;
    if (type === 1) break;
    if (type === 0) for (let i = 0; i < n; i++) mem[(hi << 8 | lo) + i] = b[4 + i];
  }
  return Array.from(mem, v => v ?? 0);
}

/* ---------- menus ---------- */
function closeMenus() { for (const [b, m] of [['mOpenBtn', 'mOpen'], ['mExportBtn', 'mExport']]) { $(m).hidden = true; $(b).setAttribute('aria-expanded', 'false'); } }
for (const [b, m] of [['mOpenBtn', 'mOpen'], ['mExportBtn', 'mExport']]) $(b).onclick = e => {
  e.stopPropagation(); const open = $(m).hidden; closeMenus(); if (!open) return;
  $(m).hidden = false; $(b).setAttribute('aria-expanded', 'true');
  $(m).querySelectorAll('[data-need=edid]').forEach(x => { x.disabled = !state.edid; x.title = state.edid ? '' : T('請先產生或匯入 EDID', 'Generate or import an EDID first'); });
  $(m).querySelector('button:not(:disabled)')?.focus();
};
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenus(); });
document.addEventListener('keydown', e => {
  const m = document.querySelector('.menu:not([hidden])'); if (!m) return;
  if (e.key === 'Escape') { e.preventDefault(); const btn = m.previousElementSibling; closeMenus(); btn.focus(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const items = [...m.querySelectorAll('button:not(:disabled)')], i = items.indexOf(document.activeElement); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); }
});
['bExample', 'bImportIni', 'bImportBin', 'bExportIni'].forEach(id => $(id).addEventListener('click', closeMenus));
// drop a file anywhere on the page
let dragDepth = 0;
document.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('drop').hidden = false; } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
document.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('drop').hidden = true;
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (/\.ini$/i.test(f.name)) f.text().then(t => loadIni(t, f.name));
  else if (/\.(bin|hex)$/i.test(f.name)) importEdidFile(f);
  else if (/\.(py|txt)$/i.test(f.name)) loadTpl(f);
  else showErrors([T(`不支援的檔案：${f.name}（請用 .ini、.bin、.hex 或 .py 範本）`, `Unsupported file: ${f.name} (use .ini, .bin, .hex or a .py template)`)]);
});
// Inside ArchFlow, Esc closes the tool once nothing in it (menu, confirm dialog) wants Esc itself.
if (HOST) window.addEventListener('keydown', e => { if (e.key === 'Escape' && !e.defaultPrevented && $('modal').hidden && !document.querySelector('.menu:not([hidden])')) { try { HOST.close(); } catch { /* ignore */ } } });
if (HOST) { $('bClose').hidden = false; $('bClose').title = T('關閉（Esc）', 'Close (Esc)'); $('bClose').setAttribute('aria-label', T('關閉 EDID Generator', 'Close EDID Generator')); $('bClose').onclick = () => { try { HOST.close(); } catch { /* ignore */ } }; document.querySelector('.lang').hidden = true; document.querySelector('.brand .tag').hidden = true; }

/* ---------- reset ---------- */
$('bReset').onclick = async () => {
  if (!await confirmBox(T('全部重設？', 'Reset all fields?'), T('所有欄位、EDID 資料與產生的程式碼都會清除。', 'Every field, the EDID data and the generated code will be cleared.'), T('全部重設', 'Reset all'), T('取消', 'Cancel'))) return;
  for (const id of FIELDS) $(id).value = '';
  for (const [k, v] of Object.entries(ADV)) $(k).value = v;
  state.format = 'OLDI'; state.ports = '1_port'; state.swap = 'Ports A and B not Swapped'; paintFormat(); paintPorts(); paintSwap();
  state.edid = null; state.code = null; setStale(false); $('textWarn').hidden = true; $('edidText').value = ''; dnCount(); $('bPy').disabled = true; $('codeCard').hidden = true; $('edidLen').textContent = '';
  showErrors([]); renderMap(); renderDecoded(); updateLive(); $('h_active').focus();
  toast(T('已將所有欄位重設為預設值。', 'All fields have been reset to default values.'));
};

for (const [k, v] of Object.entries(ADV)) $(k).value = v;
applyLang(); dnCount();
$('h_active').focus();
window.__edid = { buildEdid, inputData, state, parseIni, intelHex, parseIntelHex, cArray };
})();
</script>
